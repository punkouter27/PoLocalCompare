# Python lint for the helper scripts under scripts/ (Po web standard: test tiers + ruff).
# CI runs `ruff check .` when this file exists; locally: `uvx ruff check .`.
target-version = "py310"
line-length = 120
extend-exclude = ["src/**/wwwroot/models", "**/bin", "**/obj"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
