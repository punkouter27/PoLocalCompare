<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PoLocalCompare review fixes - before and after</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #0b0f14;
      color: #e8eef5;
    }
    body {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px;
    }
    h1, h2, p { margin-top: 0; }
    .pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 40px;
    }
    figure {
      position: relative;
      margin: 0;
      padding: 12px;
      background: #121923;
      border: 1px solid #2d3a49;
      border-radius: 12px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    figcaption {
      padding-top: 10px;
      color: #b8c7d9;
    }
    .tag {
      position: absolute;
      top: 22px;
      left: 22px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #111827;
      border: 2px solid #f59e0b;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 2px 12px #000;
    }
    .after .tag {
      border-color: #22c55e;
    }
    @media (max-width: 900px) {
      .pair { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>PoLocalCompare review fixes</h1>
  <p>Annotated before/after evidence for the UI changes completed on 2026-10-13.</p>

  <h2>Retired model recovery</h2>
  <div class="pair">
    <figure>
      <span class="tag">Before: dead end</span>
      <img src="review-fixes/model-missing-before.webp" alt="Model not found page without recovery actions">
      <figcaption>The explanation offered no route back into the product.</figcaption>
    </figure>
    <figure class="after">
      <span class="tag">After: two recovery paths</span>
      <img src="review-fixes/model-missing-after.webp" alt="Model not found page with Leaderboard and Catalog actions">
      <figcaption>Leaderboard and Catalog are now one action away.</figcaption>
    </figure>
  </div>

  <h2>Device-compatible catalog registration</h2>
  <div class="pair">
    <figure>
      <span class="tag">Before: Add stayed active</span>
      <img src="review-fixes/catalog-before.webp" alt="Catalog rows allowing incompatible browser models to be added">
      <figcaption>Models marked as incompatible could still be registered.</figcaption>
    </figure>
    <figure class="after">
      <span class="tag">After: incompatible Add disabled</span>
      <img src="review-fixes/catalog-after.webp" alt="Catalog rows with incompatible Add actions disabled">
      <figcaption>The rows remain discoverable, but this device cannot register models it cannot run.</figcaption>
    </figure>
  </div>

  <h2>Optional tournament entrants</h2>
  <div class="pair">
    <figure>
      <span class="tag">Before: automatic field only</span>
      <img src="review-fixes/tournament-before.webp" alt="Tournament page with only a random field">
      <figcaption>The generated eight-model field could only be redrawn.</figcaption>
    </figure>
    <figure class="after">
      <span class="tag">After: exactly-eight picker</span>
      <img src="review-fixes/tournament-after.webp" alt="Tournament page with entrant selection controls">
      <figcaption>Automatic drawing remains the default, with an optional accessible entrant picker.</figcaption>
    </figure>
  </div>

  <h2>Arena source inspection</h2>
  <div class="pair">
    <figure>
      <span class="tag">Before: popup action</span>
      <img src="review-fixes/arena-before.webp" alt="Arena with View Source popup buttons">
      <figcaption>Source depended on a new-tab popup surviving browser policy.</figcaption>
    </figure>
    <figure class="after">
      <span class="tag">After: inline disclosure</span>
      <img src="review-fixes/arena-after.webp" alt="Arena with source expanded inline">
      <figcaption>Raw model output is encoded and inspected in place, without a popup or app-origin blob.</figcaption>
    </figure>
  </div>

  <h2>Mobile Compare filters</h2>
  <div class="pair">
    <figure>
      <span class="tag">Before: final filter clipped</span>
      <img src="review-fixes/home-mobile-before.webp" alt="Mobile Compare page with clipped model filters">
      <figcaption>The single horizontal row hid part of the Browser/Ollama choices.</figcaption>
    </figure>
    <figure class="after">
      <span class="tag">After: all filters visible</span>
      <img src="review-fixes/home-mobile-after.webp" alt="Mobile Compare page with a two by two filter grid">
      <figcaption>A two-by-two grid exposes all four filters with no horizontal scrolling.</figcaption>
    </figure>
  </div>
</body>
</html>
