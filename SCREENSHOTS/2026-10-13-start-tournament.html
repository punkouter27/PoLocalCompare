<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start tournament - before and after</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #0b0f14;
      color: #e8eef5;
    }
    body {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px;
    }
    h1, h2, p { margin-top: 0; }
    .pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 40px;
    }
    figure {
      position: relative;
      margin: 0;
      padding: 12px;
      background: #121923;
      border: 1px solid #2d3a49;
      border-radius: 12px;
    }
    .shot { position: relative; }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    figcaption {
      padding-top: 10px;
      color: #b8c7d9;
    }
    .tag {
      position: absolute;
      top: 22px;
      right: 22px;
      z-index: 1;
      padding: 6px 10px;
      border-radius: 999px;
      background: #111827;
      border: 2px solid #f59e0b;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 2px 12px #000;
    }
    .after .tag { border-color: #22c55e; }
    /* Callout boxes, positioned as percentages of the 1280x420 capture. */
    .mark {
      position: absolute;
      border: 3px solid #f59e0b;
      border-radius: 8px;
      box-shadow: 0 0 0 2px #0008;
    }
    .after .mark { border-color: #22c55e; }
    @media (max-width: 900px) {
      .pair { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>Start tournament: why was it disabled?</h1>
  <p>2026-10-13. The button was disabled because the prompt box was empty. Captured at 1280px, light theme.</p>

  <div class="pair">
    <figure>
      <span class="tag">Before: disabled, reason off to the side</span>
      <div class="shot">
        <img src="start-tournament/before.webp" alt="Greyed-out Start tournament button with a small muted hint beside it">
        <span class="mark" style="left: 33.5%; top: 51.5%; width: 33.5%; height: 12%"></span>
      </div>
      <figcaption>The button could not be clicked, and the only explanation was a muted caption to its right.</figcaption>
    </figure>
    <figure class="after">
      <span class="tag">After: click lands in the prompt box</span>
      <div class="shot">
        <img src="start-tournament/after.webp" alt="Start tournament button enabled, prompt box focused and outlined, red hint centred under the button">
        <span class="mark" style="left: 1%; top: 10.5%; width: 98%; height: 32%"></span>
        <span class="mark" style="left: 38%; top: 52%; width: 24%; height: 17%"></span>
      </div>
      <figcaption>Start stays pressable. With no prompt, pressing it focuses the prompt box, marks it, and the hint under the button turns red. The button also no longer blanks out on hover.</figcaption>
    </figure>
  </div>
</body>
</html>
