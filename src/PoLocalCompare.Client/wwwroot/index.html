<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoLocalCompare</title>
    <base href="/" />
    <!-- ?v= on both stylesheets, for the same reason the <script src> tags below carry
         one. Without it the browser serves the previous build's CSS from cache and a change
         simply does not appear — which is how the box-sizing fix was initially verified
         against a stale sheet. Bump the number on every CSS edit. (The service worker is a
         pass-through no-op that WebLLM registers; the stale copy comes from the HTTP cache.) -->
    <!-- Fonts, as <link> rather than an @import at the top of app.css. An @import cannot be
         seen by the preload scanner — it is only discovered once app.css has been fetched and
         parsed — so the font request used to sit behind the stylesheet on the critical path.
         preconnect opens the two connections (googleapis for the CSS, gstatic for the files)
         while that is still happening.

         Weights: 400/600/700/800 for Space Grotesk, 400 for JetBrains Mono. The previous
         request included 500 for both and 600 for the mono face, none of which any rule in
         the app declares, and omitted 800, which .home__slot-vs does — so the one weight
         that was actually needed was the one not being downloaded, and the browser faked it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@400&display=swap" />
    <link rel="stylesheet" href="css/app.css?v=25" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PoLocalCompare.Client.styles.css?v=37" rel="stylesheet" />
    <!-- Loaded in <head>, before first paint: applying the theme after the body renders
         flashes the wrong palette on every navigation. -->
    <script src="js/theme.js?v=2"></script>
    <script type="importmap"></script>
</head>

<body>
    <!-- Liquid-glass refraction, referenced as backdrop-filter: url(#po-liquid) by .po-glass.
         Applied only under html.po-liquid (Chromium; wow.js decides) and never while the GPU
         lease is held — see the Liquid glass block in app.css. Fractal noise bends whatever is
         behind the panel; the displacement is modest so text under it stays readable. -->
    <svg class="po-svg-defs" aria-hidden="true" focusable="false">
        <filter id="po-liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.007 0.011" numOctaves="2" seed="7" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="boot-timeout-ui" hidden>
        <h2>Client startup is taking longer than expected</h2>
        <p id="boot-timeout-message">
            The app is still loading. If this persists, check the diagnostics page and refresh.
        </p>
        <p>
            <a href="/diag">Open diagnostics</a>
            <span class="boot-timeout__sep"> · </span>
            <a href="/">Retry</a>
        </p>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        (() => {
            const timeoutUi = document.getElementById("boot-timeout-ui");
            const timeoutMessage = document.getElementById("boot-timeout-message");
            const app = document.getElementById("app");
            const timeoutMs = 45000;

            const showFallback = (message) => {
                if (!timeoutUi || timeoutUi.hidden === false) {
                    return;
                }
                timeoutMessage.textContent = message;
                timeoutUi.hidden = false;
            };

            const hideFallback = () => {
                if (timeoutUi) {
                    timeoutUi.hidden = true;
                }
            };

            const timer = setTimeout(() => {
                showFallback("The app is still loading after 45 seconds. This usually means a client runtime asset failed to load.");
            }, timeoutMs);

            window.__clearBootTimeout = () => {
                clearTimeout(timer);
                hideFallback();
            };

            if (app) {
                const observer = new MutationObserver(() => {
                    if (!app.querySelector(".loading-progress")) {
                        window.__clearBootTimeout();
                        observer.disconnect();
                    }
                });
                observer.observe(app, { childList: true, subtree: true });
            }

            window.addEventListener("error", (event) => {
                if ((event.filename || "").includes("blazor.webassembly")) {
                    showFallback("Client runtime failed to load. Verify _framework assets and refresh.");
                }
            });
        })();
    </script>
    <script>
        (() => {
            const importMapScript = document.querySelector('script[type="importmap"]');
            let bootstrapSrc = "_framework/blazor.webassembly.js";

            if (importMapScript?.textContent) {
                try {
                    const importMap = JSON.parse(importMapScript.textContent);
                    bootstrapSrc = importMap.imports?.["./_framework/blazor.webassembly.js"] ?? bootstrapSrc;
                } catch {
                    // Keep default path when import map parsing fails.
                }
            }

            if (bootstrapSrc.startsWith("./")) {
                bootstrapSrc = bootstrapSrc.substring(2);
            }

            const script = document.createElement("script");
            script.src = bootstrapSrc;
            script.onload = () => window.__clearBootTimeout && window.__clearBootTimeout();
            script.onerror = () => {
                const timeoutUi = document.getElementById("boot-timeout-ui");
                if (timeoutUi) {
                    timeoutUi.hidden = false;
                }
            };
            document.body.appendChild(script);
        })();
    </script>
    <!-- Defer non-critical webllm-interop until app is ready -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const script = document.createElement("script");
            script.src = "/js/webllm-interop.js?v=6";
            script.async = true;
            document.body.appendChild(script);
        });
    </script>
    <script src="/js/util.js?v=18"></script>
    <script src="/js/wow.js?v=4"></script>
</body>

</html>
