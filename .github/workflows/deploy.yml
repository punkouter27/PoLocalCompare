name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  # Set by SCRIPTS/provision-azure.ps1 along with the three AZURE_* login variables. The name
  # carries a per-subscription suffix (infra/main.bicep), so it cannot be written down here.
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  AZURE_RESOURCE_GROUP: PoLocalCompare
  API_PROJECT_PATH: src/PoLocalCompare.Api/PoLocalCompare.Api.csproj

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Source-only and deterministic, so it runs alongside the suites rather than ahead of them.
  # Split out of `test` so the hygiene verdict is one obvious signal instead of being repeated
  # in every matrix leg.
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # pwsh ships on ubuntu-latest, and check-clean reads source only — no dotnet needed.
      - name: Check clean
        shell: pwsh
        run: ./SCRIPTS/check-clean.ps1

  test:
    name: Test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One suite failing must not cancel the others: seeing every failure in one pass is what
      # makes a red run diagnosable without re-running it three times.
      fail-fast: false
      matrix:
        suite: [Unit, Integration, E2EAPI]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      # The three suites do not depend on each other, so they run as parallel legs rather than in
      # sequence: same gates, roughly a third of the wall clock. Integration and E2EAPI spin
      # Azurite via Testcontainers, and the ubuntu runner ships a Docker daemon.
      - name: ${{ matrix.suite }}
        run: dotnet test tests/PoLocalCompare.${{ matrix.suite }} -c Release --logger "trx;LogFileName=${{ matrix.suite }}.trx"

      # PoLocalCompare.E2EUI is deliberately NOT run here: it drives a real headed Chrome
      # against a running instance and exercises WebGPU paths a runner has no GPU for.
      # Run it locally after touching UI markup — see AGENTS.md §8.

      # Named per leg: a shared name would have the three uploads collide.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}
          path: '**/TestResults/*.trx'
          retention-days: 7

  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: [hygiene, test]
    timeout-minutes: 30
    steps:
      # lfs: the vendored web-llm.js bundle is an LFS object and gets published into wwwroot.
      # Without this the runner checks out the ~130-byte pointer file instead and every browser
      # model fails at import time in the deployed app.
      - uses: actions/checkout@v4
        with:
          lfs: true
      # The catalog lives in two files that must agree: ModelSeeder.cs (which seeds Table
      # Storage) and web-llm.js's prebuiltAppConfig (which tells WebLLM where weights are).
      # plan-webllm-artifacts.py parses both, is the single source of the model list for
      # download-models.py, and exits non-zero when they disagree. Until now it was enforced by
      # anyone remembering to run it, which is the same state the test budgets were in.
      #
      # Deliberately here and not in the `test` job: only this job checks out with lfs, and
      # without it web-llm.js is a ~130-byte pointer, so the script would find no models and
      # report a mismatch it cannot actually see.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check the browser-model catalog agrees
        run: python SCRIPTS/plan-webllm-artifacts.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      # publish implies restore + build — no separate steps needed.
      - run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 1

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      # Checkout is required so the freshness check can read this commit's index.html.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Same step in every Po web repo. F1 gives the app about 60 CPU-minutes a day; once spent, Azure stops the
      # site (usageState Exceeded) until 00:00 UTC and refuses the package with a bare 403. Say what it is.
      - name: Check the F1 daily CPU quota
        run: |
          usage=$(az webapp show -g "${{ github.event.repository.name }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" --query usageState -o tsv)
          if [ "$usage" = "Exceeded" ]; then
            echo "::error::${{ vars.AZURE_WEBAPP_NAME }} has used up its F1 daily CPU quota, so Azure refuses the package until 00:00 UTC. Rerun after that."
            exit 1
          fi

      # CI deploys code only. Its identity holds Website Contributor on this RG and nothing else,
      # so it cannot run infra/main.bicep (subscription scope, role assignments) — provisioning is
      # SCRIPTS/provision-azure.ps1, run by a subscription owner.
      - name: Ensure infrastructure
        run: |
          if [ -z "$AZURE_WEBAPP_NAME" ]; then
            echo "::error::AZURE_WEBAPP_NAME repo variable is not set — run SCRIPTS/provision-azure.ps1"; exit 1
          fi
          if ! az webapp show -n "$AZURE_WEBAPP_NAME" -g "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "::error::App Service '$AZURE_WEBAPP_NAME' not found in '$AZURE_RESOURCE_GROUP' — run SCRIPTS/provision-azure.ps1"; exit 1
          fi
      - run: cd publish && zip -r ../webapp.zip . && cd ..
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: webapp.zip
      - name: Verify deployment (health, freshness, auth gate, SPA mount)
        run: |
          base="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          sleep 30
          ok=0
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$base/health" --max-time 30 || echo "000")
            echo "Health check $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then echo "::error::/health never returned 200"; exit 1; fi
          # Platform liveness probe (Platform/PoPlatform.cs, shared across the Po repos). It is
          # dependency-free by design, so a 200 here means the process itself is up even when
          # Table Storage is the thing that is broken — the two probes answer different questions.
          LIVE=$(curl -s -o /dev/null -w "%{http_code}" "$base/health/live" --max-time 30 || echo "000")
          echo "Liveness probe: HTTP $LIVE"
          [ "$LIVE" = "200" ] || { echo "::error::/health/live did not return 200"; exit 1; }
          # SPA mount guard — catches trimmed/broken WASM publishes that /health can't see.
          ROOT=$(curl -s "$base/" --max-time 30)
          echo "$ROOT" | grep -q "blazor.webassembly.js" || { echo "::error::index.html is missing the Blazor bootstrap"; exit 1; }
          BOOT=$(curl -s -o /dev/null -w "%{http_code}" "$base/_framework/blazor.webassembly.js" --max-time 30 || echo "000")
          echo "Blazor bootstrap asset: HTTP $BOOT"
          [ "$BOOT" = "200" ] || { echo "::error::Blazor framework assets are not being served"; exit 1; }

          # Freshness: the cache-buster on app.css that the live page serves must equal the one
          # in THIS commit's index.html. Read from the checkout rather than hardcoded, so bumping
          # the buster does not require touching this workflow.
          #
          # Without this the step could pass against a site that silently kept serving the
          # previous build — which is the exact failure mode an HTTP cache makes easy.
          EXPECTED=$(grep -o 'css/app\.css?v=[0-9]*' src/PoLocalCompare.Client/wwwroot/index.html | head -1)
          SERVED=$(echo "$ROOT" | grep -o 'css/app\.css?v=[0-9]*' | head -1)
          echo "cache-buster in commit: '$EXPECTED' / served: '$SERVED'"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$SERVED" ]; then
            echo "::error::live index.html is stale (served '$SERVED', expected '$EXPECTED')"; exit 1
          fi

          # The auth gate survived the deploy. Server authorization is deny-by-default via
          # FallbackPolicy, so a 200 here means an endpoint group quietly lost its
          # RequireAuthorization() — which is precisely the risk in a change that rewrites the
          # endpoint map, and nothing else in this pipeline would notice.
          for path in /api/models /api/leaderboard /api/duels; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$base$path" --max-time 20 || echo "000")
            echo "anonymous $path: HTTP $CODE"
            [ "$CODE" = "401" ] || { echo "::error::anonymous $path returned $CODE, expected 401"; exit 1; }
          done

          echo "Deployment verified: health, liveness, freshness, auth gate and SPA assets OK."

      # Same gate in every Po web repo: the new build is the one answering (X-Commit on /health/live is this
      # commit, not the old instance still serving), then its dependencies answer (/health).
      - name: Health gate (this commit on /health/live, then /health)
        shell: bash
        run: |
          base="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for attempt in $(seq 1 60); do
            commit=$(curl -s -D - -o /dev/null --max-time 30 "$base/health/live" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-commit" {print $2}')
            [ "$commit" = "$GITHUB_SHA" ] && { echo "/health/live serves $GITHUB_SHA (attempt $attempt)"; break; }
            [ "$attempt" = "60" ] && { echo "::error::/health/live still serves ${commit:-no X-Commit header}, not $GITHUB_SHA"; exit 1; }
            sleep 15
          done
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/health" || echo 000)
            [ "$code" = "200" ] && { echo "/health -> 200 (attempt $attempt)"; exit 0; }
            sleep 15
          done
          echo "::error::/health never returned 200 (last: $code)"; exit 1
